name: Fetch voice files
on:
  push:
    branches: [claude/project-thread-4u8lak]
    paths: ['.github/workflows/fetch-voice-files.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Kokoro files and licences
        run: |
          set -e
          B=https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main
          mkdir -p dl/voices && cd dl
          for f in config.json tokenizer.json tokenizer_config.json onnx/model_quantized.onnx; do mkdir -p $(dirname $f); curl -sSfL -o $f $B/$f; done
          for v in af_heart af_bella am_michael am_fenrir bf_emma bm_george ef_dora em_alex ff_siwis if_sara im_nicola pf_dora pm_alex; do curl -sSfL -o voices/$v.bin $B/voices/$v.bin; done
          curl -sSfL -o README-onnx.md $B/README.md
          curl -sSfL -o README-kokoro.md https://huggingface.co/hexgrad/Kokoro-82M/raw/main/README.md
          curl -sSfL -o VOICES.md https://huggingface.co/hexgrad/Kokoro-82M/raw/main/VOICES.md || true
          ls -laR
      - name: Commit in 14 MB pieces
        run: |
          mkdir -p voice-files
          cd dl
          split -b 14m -d -a 2 onnx/model_quantized.onnx ../voice-files/model.part
          cp config.json tokenizer.json tokenizer_config.json README-onnx.md README-kokoro.md ../voice-files/
          [ -f VOICES.md ] && cp VOICES.md ../voice-files/
          cp -r voices ../voice-files/
          sha256sum onnx/model_quantized.onnx > ../voice-files/model.sha256
          cd .. && git config user.name "Claude" && git config user.email "noreply@anthropic.com"
          git add voice-files && git commit -m "Voice test: Kokoro model files for the self-contained test page" && git push
