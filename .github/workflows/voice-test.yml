name: Voice test check
on:
  push:
    branches: [claude/project-thread-4u8lak]
  workflow_dispatch:
jobs:
  phone-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Voice licences (model cards)
        run: |
          for v in es/es_ES/davefx/medium fr/fr_FR/siwis/medium de/de_DE/thorsten/medium en/en_GB/alba/medium; do
            echo "=== $v"; curl -sL "https://huggingface.co/rhasspy/piper-voices/raw/main/$v/MODEL_CARD" | head -20
          done
          echo "=== Kokoro"; curl -sL https://huggingface.co/hexgrad/Kokoro-82M/raw/main/README.md | head -12
          echo "=== kokoro size"; curl -sIL https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_quantized.onnx | grep -i content-length
      - name: Install Playwright
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Phone check (hosted page)
        env:
          URL: https://rawcdn.githack.com/gilsonr0566-sys/kairoute-beta2/${{ github.sha }}/voice-test/index.html
        run: |
          curl -sI "$URL" | head -12
          curl -sI "${URL%index.html}coi-serviceworker.js" | grep -i -E "^HTTP|content-type"
          node tools/phone-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: voice-shots, path: shots/ }
