name: Publish Beta 2
# The Beta 2 copy of Kairoute (planned by the new engine), built from the Kairoute repository's Beta 2 branch with
# build-beta2.sh and published here as plain files. Nothing to build here: every push publishes these files.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish-beta2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only what the release gate passed (QA spec v2, T4; Richard Nov 23: "refuses to publish when it cannot
      # demonstrate that a trip is safe"). version.txt starts with the Kairoute commit the page was built from; that exact
      # commit must have a successful "Beta 2 release gate" run, whose last job passes only when the report says
      # RELEASE OK. No run, a failed run, or a run still going: nothing is published. There is no override.
      - name: The release gate passed this exact commit (RELEASE OK)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          short=$(tr -d '\n' < version.txt | cut -d- -f1)
          sha=$(gh api "repos/gilsonr0566-sys/kairoute/commits/$short" --jq .sha) || { echo "REFUSED: version.txt names '$short', not a Kairoute commit"; exit 1; }
          ok=$(gh api "repos/gilsonr0566-sys/kairoute/actions/workflows/beta2-gate.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.workflow_runs[0].html_url // empty')
          [ -n "$ok" ] || { echo "REFUSED: commit $sha has no passing release gate run (RELEASE OK). Run the gate on it, fix what it finds, then publish."; exit 1; }
          # Gate runs before 01305861 went green on any report, DO NOT RELEASE included (escapes E19): only a commit that
          # contains that fix can carry a green run that means RELEASE OK.
          st=$(gh api "repos/gilsonr0566-sys/kairoute/compare/01305861...$sha" --jq .status) || st=none
          case "$st" in ahead|identical) ;; *) echo "REFUSED: commit $sha does not contain the gate verdict fix 01305861 ($st); its green run may hide DO NOT RELEASE"; exit 1;; esac
          echo "Release gate passed $sha: $ok"
      - run: mkdir _site && cp -r index.html usage.html version.txt .nojekyll manifest.webmanifest sw.js icons lib ai.json audio _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # The site is only "published" when the live page serves this version (a deploy can fail on GitHub's side).
      - name: Check the live site serves this version
        run: |
          want=$(tr -d '\n' < version.txt)
          for n in $(seq 1 30); do got=$(curl -fsS "https://gilsonr0566-sys.github.io/Kairoute-Beta2/version.txt?n=$n" | tr -d '\n' || true)
            [ "$got" = "$want" ] && { echo "live: $got"; exit 0; }; sleep 10; done
          echo "live site still serves '$got', expected '$want'"; exit 1
